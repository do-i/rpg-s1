[workspace]
members = ["crates/rpg-content", "crates/rpg-engine"]
exclude = ["vendor/bevy_audio"]
resolver = "3"

[patch.crates-io]
# Bevy 0.19 keeps failed output streams alive. Reopen them with bounded retries.
bevy_audio = { path = "vendor/bevy_audio" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

[package]
name = "rpg-s1"
version = "2026.10.1"
edition = "2024"
rust-version = "1.97"
description = "A small Rust and Bevy RPG prototype"

[lints]
workspace = true

[dependencies]
rpg-engine = { path = "crates/rpg-engine" }

# Release builds link as one optimisation unit: thin LTO with a single codegen unit removes dead
# code across crates (smaller binary, a few percent less main-schedule time), at the cost of a
# longer release build. Symbols are stripped to shrink the binary; panic messages keep file and
# line, but backtraces show addresses instead of function names.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
# Line tables keep file and line in backtraces; full debug info fills the build volume.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
