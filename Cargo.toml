[workspace]
members = ["crates/rpg-content", "crates/rpg-engine"]
exclude = ["vendor/bevy_audio"]
resolver = "3"

[patch.crates-io]
# Bevy 0.19 keeps failed output streams alive. Reopen them with bounded retries.
bevy_audio = { path = "vendor/bevy_audio" }

[package]
name = "rpg-s1"
version = "2026.10.1"
edition = "2024"
rust-version = "1.97"
description = "A small Rust and Bevy RPG prototype"

[dependencies]
rpg-engine = { path = "crates/rpg-engine" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
