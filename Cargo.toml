[workspace]
members = ["crates/rpg-content", "crates/rpg-engine"]
resolver = "3"

[package]
name = "rpg-s1"
version = "2026.8.1"
edition = "2024"
rust-version = "1.97"
description = "A small Rust and Bevy RPG prototype"

[dependencies]
rpg-engine = { path = "crates/rpg-engine" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
