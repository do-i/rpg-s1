name: CI

on:
  push:
    # Every branch still gets CI, but a release tag must not: release.sh pushes
    # main and the tag atomically, and release.yml already builds the tag.
    # Without this, one cut would queue three runs instead of one.
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      # Read-only: an asset edited without committing its refreshed home-grown ledger hash fails
      # here, before any Cargo step, and the message points at ./scripts/build.sh.
      - name: Check home-grown asset hashes are current
        run: |
          python3 -m unittest -v scripts/test_update_asset_hashes.py scripts/test_build_wrappers.py
          python3 scripts/update_asset_hashes.py --check
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # `--workspace` is load-bearing, not decoration. This manifest has a root package *and* a
      # `[workspace]` members list, so a bare `cargo test` resolves to the default members -- the
      # root package alone, whose only target is `src/main.rs` with zero tests. Every test in
      # `crates/rpg-content` and `crates/rpg-engine` was being skipped, and `--all-targets` selects
      # target kinds rather than packages, so clippy linted only the root package too.
      # (`cargo fmt` already walks the workspace; `--all` is explicit for consistency.)
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Validate the asset-rights checker and report current blockers
        run: |
          python3 -m unittest -v scripts/test_check_asset_rights.py
          python3 scripts/check_asset_rights.py --report-only
      # Content, not code: the three checks above all passed while `manifest.yaml` pointed at a
      # cursor image that does not exist. The validator catches that class, but it exits non-zero
      # on accepted inherited diagnostics, so it gates against the scenario-owned baseline
      # rather than against zero -- failing on a new diagnostic and on a baseline line the report
      # no longer produces.
      - name: Validate the production scenario against its accepted diagnostics
        run: cargo run -- validate-scenario rusted_kingdoms --baseline assets/scenarios/rusted_kingdoms/validation-baseline.txt

  editor-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install map-editor dependencies
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/python -m pip install -r tools/requirements.txt
      - name: Test editor publication, portals, conflicts, and previews
        run: tools/.venv/bin/python -m unittest discover -s tools/map_editor/tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/map_editor_web/package-lock.json
      - name: Install frontend dependencies from lockfile
        working-directory: tools/map_editor_web
        run: npm ci
      - name: Test frontend conflict recovery and preview updates
        working-directory: tools/map_editor_web
        run: npm test
      - name: Typecheck and build frontend
        working-directory: tools/map_editor_web
        run: npm run build
      - name: Check the production editor graph
        run: bash scripts/map-editor.sh check
