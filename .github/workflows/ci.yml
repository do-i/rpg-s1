name: CI

on:
  push:
    # Every branch still gets CI, but a release tag must not: release.sh pushes
    # main and the tag atomically, and release.yml already builds the tag.
    # Without this, one cut would queue three runs instead of one.
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      # `--workspace` is load-bearing, not decoration. This manifest has a root package *and* a
      # `[workspace]` members list, so a bare `cargo test` resolves to the default members -- the
      # root package alone, whose only target is `src/main.rs` with zero tests. Every test in
      # `crates/rpg-content` and `crates/rpg-engine` was being skipped, and `--all-targets` selects
      # target kinds rather than packages, so clippy linted only the root package too.
      # (`cargo fmt` already walks the workspace; `--all` is explicit for consistency.)
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
