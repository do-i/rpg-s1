title:
  default:          bgm/Chronicles_of_the_Lost_Flame_Title.mp3

battle:
  normal:           bgm/Pixelated_Crusade.mp3
  boss:             bgm/Crimson_Storm_s_Echo.mp3

town:
  default:          bgm/Whiteveil_Streets.mp3
  bamboo:           bgm/Whispers_of_the_Bamboo_Grove.mp3

zone:
  starting_forest:  bgm/Storming_the_Citadel.mp3
  open_plains:      bgm/Sun_Kissed_Horizon.mp3
  alpine:           bgm/Whispers_of_the_Alpine_Stream.mp3
  dark:             bgm/Whispers_in_the_Unfolding_Dark.mp3
  # The Hearth Descent. The stronghold above it already owns `zone.dark`, and
  # the descent is a different place — the memory chambers should not sound like
  # the corridor the player fought through to reach them.
  hearth:           bgm/Across_the_Sundered_Peaks_64.mp3
  # The marshland and the Ancient Ruins arc declared no BGM at all, so both simply
  # kept playing whichever town track the player arrived from. These three tracks
  # shipped in the scenario and were reachable from nothing: they were filed under
  # an `overworld:` group no map, scene or catalog ever named.
  marsh:            bgm/Golden_Hour_Haze.mp3
  ruins:            bgm/The_Horizon_s_Call.mp3
  # Zones 7, 8, 9 and 10 all shared `zone.dark`, so the whole endgame ran on one
  # track. The volcanic region is the one with its own character, and it is where
  # the Cinder Marshal is met.
  volcanic:         bgm/Neon_Samurai_s_Lament.mp3
