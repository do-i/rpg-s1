  spell_wind:     sfx/atk_magic/25_Wind_01.mp3
  spell_earth:    sfx/atk_magic/30_Earth_02.mp3
  # A whiff had no cue at all; the floating MISS label carried it alone.
  miss:           sfx/battle/35_Miss_Evade_02.mp3
  miss_2:         sfx/dungeon/27_sword_miss_1.mp3
  miss_3:         sfx/dungeon/27_sword_miss_2.mp3
  miss_4:         sfx/dungeon/27_sword_miss_3.mp3
  # Sleep and poison used to share the generic `debuff` cue with every other
  # affliction. Both are distinctive enough in play to earn their own.
