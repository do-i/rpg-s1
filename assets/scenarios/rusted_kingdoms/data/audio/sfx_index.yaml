  atk_impact_2:   sfx/dungeon/26_sword_hit_1.mp3
  atk_impact_3:   sfx/dungeon/26_sword_hit_2.mp3
  atk_impact_4:   sfx/dungeon/26_sword_hit_3.mp3
  party_hit_2:    sfx/dungeon/11_human_damage_1.mp3
  party_hit_3:    sfx/dungeon/11_human_damage_2.mp3
  party_hit_4:    sfx/dungeon/11_human_damage_3.mp3
  defend:         sfx/battle/39_Block_03.mp3
  flee:           sfx/battle/51_Flee_02.mp3
  enemy_death:    sfx/battle/69_Enemy_death_01.mp3
  heal:           sfx/buffs_heals/02_Heal_02.mp3
