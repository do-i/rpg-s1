# --- B3.6: the shipped accessory slot held three entries, two of them rogue-only and none
# granting a stat, so four of the five classes had exactly one accessory in the whole game
# (holy_talisman, from the Ashenveil oracle) and it changed no number. These use the new
# attribute shape and are open to every class, giving the slot a real choice per act.

