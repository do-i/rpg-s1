entries:
  - lines:
      - "Trail Marker — Lower Pass"
      - "The last dry camp before the ravine. Fill what you carry here; the springs above run white and bitter."
      - "Snow closes this road early. Someone scratched a tally of winters below the text, and stopped at four."
