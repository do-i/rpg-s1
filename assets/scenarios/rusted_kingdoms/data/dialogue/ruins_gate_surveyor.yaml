# data/dialogue/ruins_gate_surveyor.yaml
#
# A surveyor at the excavation camp beside the road to Ruinwatch.
id: ruins_gate_surveyor
type: npc

entries:
  - condition:
      requires: [boss_zone04_defeated]
    lines:
      - "You went in and came out. That puts you one ahead of every survey I've filed."
      - "I'll write it down as 'passable.' The guild can argue with the corpses if they disagree."

  - condition:
      requires: [ruins_gate_surveyor_briefed]
    lines:
      - "Through the arch, then follow the broken lane west for the courtyard. The northern road returns to Ruinwatch."
      - "The flooded colonnade has a stone crossing. The houses beyond it haven't been opened in centuries. That isn't a promise of safety."

  - lines:
      - "Third season measuring this gate and I still can't tell you who built it."
      - "The stone's older than the kingdom. Older than the language we'd need to ask it anything."
      - "The sentries still defend the breach. Draw them out, then search the roofless homes to the southeast."
      - "Someone pried the lids off every empty tomb. If you find one still sealed, mind the trap."
      - "Take a lamp oil ration. Past the courtyard the daylight stops meaning much."
    on_complete:
      set_flag: ruins_gate_surveyor_briefed
      give_items:
        - id: ether
          qty: 2
