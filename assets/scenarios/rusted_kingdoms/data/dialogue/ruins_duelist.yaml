id: ruins_duelist
type: npc

entries:
  - lines:
      - "These halls punish haste. Keep your guard high and your footing deliberate."
      - "The dead still answer the old gate. Let one follow you through the breach; don't fight the whole watch at once."
      - "Those were homes once, northwest of the gate. Now the roofs fall faster than the dead."
      - "The drowned columns mark a longer path around the fallen walls. Watch the rubble by the ruined houses."
