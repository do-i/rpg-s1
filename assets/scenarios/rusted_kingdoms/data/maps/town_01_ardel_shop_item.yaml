    name: "Wilkin"
    dialogue: item_shop_ardel
    position: [6, 4]
    sprite: media/sprites/npc/merchant_base.tsx
    default_facing: down
    interaction_range: 2.5
    animation:
      mode: step
      speed: 0.7

shop:
