# rusted_kingdoms/manifest.yaml
# -- updated refs and protagonist.sprite path --

id: my_rpg_story
name: "Chronicles of the Lost Flame"
version: "1.0.0"
window_title: "Rusted Kingdoms"

title:
  image: media/images/title_bg/title_lost_flame.webp
  cursor_icon: media/images/icons/arrow-head-right.webp

font:
  path: media/fonts/Philosopher-Regular.ttf

ui:
  # Backdrop behind field menus (item/spell/equip/status/shops/inn).
  menu_backdrop: media/images/battle_bg/zone4-sanctum-bg-1280x468.webp

apothecary:
  sprite: media/sprites/npc/female_wiz_01.tsx
  icons:
    locked:  media/images/icons/lock-locked-red-small.webp
    ready:   media/images/icons/lock-unlocked-green-small.webp
    missing: media/images/icons/lock-unlocked-yellow-small.webp

inn:
  sprite: media/sprites/npc/female_blue_01.tsx

item_shop:
  sprite: media/sprites/npc/teen_halfmessy_01.tsx

weapon_shop:
  sprite: media/sprites/npc/male_sword_fighter_axe_fighter.tsx

armor_shop:
  sprite: media/sprites/npc/plate_knight_base.tsx

item_box:
  sprite: media/sprites/objects/item_box.tsx

# Message boards: map tiles the player can read. Any cell painted with one of
# these local tile ids from the named tileset becomes a readable sign that
# plays the per-map dialogue file `data/dialogue/sign_<map_id>.yaml`.
signs:
  tileset: stone_tile_stares_16x16
  tile_ids: [18, 19, 20, 21]

protagonist:
  id: aric
  name: "Aric"
  class: hero
  sprite: media/sprites/party/01_aric_walk.tsx

start:
  map: town_01_ardel
  position: [14, 5]
  intro_dialogue: data/dialogue/intro_cutscene.yaml

bootstrap_flags:
  - story_quest_started

engine_managed_flags:
  # Set by the epilogue's terminal line; consumed by the engine, which moves the
  # app into the credits. Content never reads it, so it is declared here.
  - game_complete
  - story_act2_started
  - story_act3_started
  - story_act4_started
  - boss_zone10_defeated

refs:
  transport:  data/transport.yaml
  party:      data/party.yaml
  classes:    data/classes/
  maps:       data/maps/
  dialogue:   data/dialogue/
  items:      data/items/
  enemies:    data/enemies/
  encount:    data/encount/
  recipe:     data/recipe/
  quests:     data/quests.yaml
  balance:    data/balance.yaml
  battle_backgrounds: data/battle_backgrounds.yaml
  assets:     media/
  tmx:        media/maps/
