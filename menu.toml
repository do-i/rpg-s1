# Developer menu for lazymenu-cli. Run `lazymenu-cli` from the repository root.

[menu]
title = "rpg-s1 dev menu"
quit_key = "q"
loop = true
key_format = "{key})"
selected_foreground = "black"
selected_background = "cyan"
selected_bold = true

[[items]]
id = "run-debug"
label = "Run - Debug"
key = "d"
command = ["env", "RPG_S1_MUTE_AUDIO=1", "RPG_S1_DEBUG_COLLISION=1", "cargo", "run"]
group = "Play"
tags = ["run", "play", "game", "ardel", "world", "menu", "save", "load", "items", "equipment", "spells", "debug", "collision", "portal"]
description = "Play the Ardel slice with sound disabled and the portal/collision debug overlay on, native save/load, party, items, equipment, spells, and teleport"
favorite = true

[[items]]
id = "run-fast"
label = "Run - Fast"
key = "r"
command = ["cargo", "run", "--release"]
group = "Play"
tags = ["run", "play", "game", "release", "fast", "performance", "framerate"]
description = "Play the Ardel slice from an optimized release build for a true read on framerate and load times"

[[items]]
id = "validate-scenario"
label = "Validate scenario data"
key = "v"
command = ["cargo", "run", "--", "validate-scenario"]
group = "Quality"
tags = ["validate", "scenario", "data", "rust"]
description = "Validate the default Rusted Kingdoms package without launching Bevy"

[[items]]
id = "build-release"
label = "Build release binary"
key = "b"
command = ["cargo", "build", "--release"]
group = "Build"
tags = ["build", "release", "binary"]
description = "Build an optimized native binary in target/release"

[[items]]
id = "release-status"
label = "Release Status"
key = "u"
command = ["scripts/release.sh", "status"]
group = "Release"
tags = ["release", "status", "version", "tag", "dev", "main"]
description = "Show dev/main state, the latest tag, and the version today's cut would use — changes nothing"

[[items]]
id = "release-bump"
label = "Release 1 Cut"
key = "n"
command = ["scripts/release.sh", "bump"]
group = "Release"
tags = ["release", "bump", "version", "dev", "cut"]
description = "Bump the version on dev and push, then stop — no CI wait. Follow up with 'Release 2 Tag/Push' once CI is green"
confirm = true

[[items]]
id = "release-tag"
label = "Release 2 Tag/Push"
key = "g"
command = ["scripts/release.sh", "tag"]
group = "Release"
tags = ["release", "tag", "publish", "binary", "main"]
description = "Check CI once (no wait) and, if green, fast-forward main and push the tag that builds the release binary"
confirm = true

[[items]]
id = "clean"
label = "Clean build artifacts"
key = "x"
command = ["cargo", "clean"]
group = "Maintenance"
tags = ["clean", "target", "delete"]
description = "Delete Cargo build output"
confirm = true
