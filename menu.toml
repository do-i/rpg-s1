# Developer menu for lazymenu-cli. Run `lazymenu-cli` from the repository root.

[menu]
title = "rpg-s1 dev menu"
quit_key = "q"
loop = true
key_format = "{key})"
selected_foreground = "black"
selected_background = "cyan"
selected_bold = true

[[items]]
id = "run-debug"
label = "Run - Debug"
key = "d"
command = ["env", "RPG_S1_MUTE_AUDIO=1", "RPG_S1_DEBUG_COLLISION=1", "cargo", "run"]
group = "Play"
tags = ["run", "play", "game", "ardel", "world", "menu", "save", "load", "items", "equipment", "spells", "debug", "collision", "portal"]
description = "Play the normal campaign with sound disabled and the portal/collision debug overlay on"
favorite = true

[[items]]
id = "run-debug-full-party"
label = "Run - Debug full party"
key = "f"
command = ["env", "RPG_S1_MUTE_AUDIO=1", "RPG_S1_DEBUG_COLLISION=1", "RPG_S1_PARTY_PRESET=full", "cargo", "run"]
group = "Play"
tags = ["run", "play", "game", "debug", "party", "full", "battle", "collision", "level", "rewards"]
description = "Debug run that skips the title and starts in the world with all five party members, for checking four- and five-slot battle layout, level-ups, and victory rewards"
favorite = true

[[items]]
id = "run-fast"
label = "Run - Fast"
key = "r"
command = ["cargo", "run", "--release"]
group = "Play"
tags = ["run", "play", "game", "release", "fast", "performance", "framerate"]
description = "Play the normal campaign from an optimized build for representative framerate and load-time checks"

[[items]]
id = "play-seeded"
label = "Play - Seed 1"
key = "p"
command = ["cargo", "run", "--", "play", "rusted_kingdoms", "--seed", "1"]
group = "Play"
tags = ["play", "seed", "deterministic", "normal", "title"]
description = "Launch normal-mode Rusted Kingdoms with the documented deterministic seed"

[[items]]
id = "run-map-ardel"
label = "Run map - Ardel"
key = "m"
command = ["cargo", "run", "--", "play", "rusted_kingdoms", "--seed", "1", "--start-map", "town_01_ardel", "--start-position", "10,0"]
group = "Play"
tags = ["run", "map", "debug", "ardel", "position", "author"]
description = "Validate the debug start and launch directly on a walkable Ardel tile"

[[items]]
id = "record-author-check"
label = "Record - Author check"
key = "c"
command = ["cargo", "run", "--", "record", "/tmp/rpg-s1-menu-record.yaml", "rusted_kingdoms", "--seed", "13", "--start-map", "town_01_ardel", "--start-position", "10,0"]
group = "Replay"
tags = ["record", "replay", "actions", "deterministic", "author"]
description = "Record normalized Ardel actions to /tmp/rpg-s1-menu-record.yaml; recording refuses an existing file"

[[items]]
id = "replay-author-check"
label = "Replay - Author check"
key = "y"
command = ["cargo", "run", "--", "replay", "/tmp/rpg-s1-menu-record.yaml"]
group = "Replay"
tags = ["replay", "record", "actions", "hash", "deterministic"]
description = "Replay /tmp/rpg-s1-menu-record.yaml and verify every recorded state checkpoint"

[[items]]
id = "validate-scenario"
label = "Validate scenario data"
key = "v"
command = ["cargo", "run", "--", "validate-scenario"]
group = "Quality"
tags = ["validate", "scenario", "data", "rust"]
description = "Validate the default Rusted Kingdoms package without launching Bevy"

[[items]]
id = "map-sweep"
label = "Map sweep"
key = "l"
command = ["cargo", "run", "--", "map-sweep", "rusted_kingdoms"]
group = "Quality"
tags = ["map", "sweep", "tmx", "tsx", "headless", "validate"]
description = "Run structural checks and load every migrated map for five headless Bevy frames"

[[items]]
id = "dialogue-sweep"
label = "Dialogue sweep"
key = "o"
command = ["cargo", "run", "--", "dialogue-sweep", "rusted_kingdoms"]
group = "Quality"
tags = ["dialogue", "sweep", "branch", "cycle", "validate"]
description = "Traverse every dialogue branch and report exact cycles or graph errors"

[[items]]
id = "encounter-sweep"
label = "Encounter sweep"
key = "e"
command = ["cargo", "run", "--", "encounter-sweep", "rusted_kingdoms"]
group = "Quality"
tags = ["encounter", "battle", "enemy", "asset", "sweep", "validate"]
description = "Construct every formation and boss and load all referenced battle assets"

[[items]]
id = "test-workspace"
label = "Run test suite"
key = "t"
command = ["cargo", "test", "--workspace"]
group = "Quality"
tags = ["test", "suite", "workspace", "quality", "ci"]
description = "Run the complete Rust workspace test suite"

[[items]]
id = "editor-setup"
label = "Map editors - Setup/check"
key = "s"
command = ["scripts/map-editor.sh", "setup"]
group = "Authoring"
tags = ["editor", "setup", "prerequisite", "pygame", "web", "map"]
description = "Prepare the pinned external editor checkout, Python environment, and web frontend"

[[items]]
id = "editor-pygame"
label = "Map editor - Pygame"
key = "i"
command = ["scripts/map-editor.sh", "pygame"]
group = "Authoring"
tags = ["editor", "pygame", "portal", "tmx", "map"]
description = "Launch the pinned Pygame portal editor against the Rust scenario tree"

[[items]]
id = "editor-web"
label = "Map editor - Web"
key = "w"
command = ["scripts/map-editor.sh", "web"]
group = "Authoring"
tags = ["editor", "web", "browser", "portal", "tmx", "map"]
description = "Launch the pinned web portal editor against the Rust scenario tree"

[[items]]
id = "build-release"
label = "Build release binary"
key = "b"
command = ["cargo", "build", "--release"]
group = "Build"
tags = ["build", "release", "binary"]
description = "Build an optimized native binary in target/release"

[[items]]
id = "release-status"
label = "Release Status"
key = "u"
command = ["scripts/release.sh", "status"]
group = "Release"
tags = ["release", "status", "version", "tag", "dev", "main"]
description = "Show dev/main state, the latest tag, and the version today's cut would use — changes nothing"

[[items]]
id = "release-bump"
label = "Release 1 Cut"
key = "n"
command = ["scripts/release.sh", "bump"]
group = "Release"
tags = ["release", "bump", "version", "dev", "cut"]
description = "Bump the version on dev and push, then stop — no CI wait. Follow up with 'Release 2 Tag/Push' once CI is green"
confirm = true

[[items]]
id = "release-tag"
label = "Release 2 Tag/Push"
key = "g"
command = ["scripts/release.sh", "tag"]
group = "Release"
tags = ["release", "tag", "publish", "binary", "main"]
description = "Check CI once (no wait) and, if green, fast-forward main and push the tag that builds the release binary"
confirm = true

[[items]]
id = "clean"
label = "Clean build artifacts"
key = "x"
command = ["cargo", "clean"]
group = "Maintenance"
tags = ["clean", "target", "delete"]
description = "Delete Cargo build output"
confirm = true
